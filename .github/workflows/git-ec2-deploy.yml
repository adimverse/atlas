name: Git EC2 Deploy

on:
  # push:
  #   branches:
  #     - incention-develop
  workflow_dispatch:


jobs:
  build-and-release:
    environment: development
    runs-on: ubuntu-latest
    steps:
      - name: Setup ENV File
        run: |
          cat << 'EOF' > .env
          ${{ secrets.ENV_FILE }}
          EOF

      - name: Copy EC2 build script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: ./scripts/build-ec2-atlas-twitter-agent.sh
          target: /home/${{ secrets.EC2_USERNAME }}/

      - name: Copy .env file to EC2 Instance
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: .env
          target: /home/${{ secrets.EC2_USERNAME }}/eliza/

      - name: Deploy to EC2 instance
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: source ~/.zshrc && zsh ~/build-ec2-atlas-twitter-agent.sh
