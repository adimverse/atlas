version: 0.0
os: linux

files:
  - source: /
    destination: /home/ubuntu/atlas

hooks:
  BeforeInstall:
    - location: scripts/codedeploy/stop_server.sh
      timeout: 300
      runas: ubuntu
  AfterInstall:
    - location: scripts/codedeploy/install_dependencies.sh
      timeout: 1800
      runas: ubuntu
  ApplicationStart:
    - location: scripts/codedeploy/start_server.sh
      timeout: 300
      runas: ubuntu
